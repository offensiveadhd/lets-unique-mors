<g opacity="1"><text x="40" y="300" font-size="22">You key dots and dashes. Each settled word goes up.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.1458;.1583;.9833;.9958;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">You ask Doto to spell a word for you.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.1583;.1708;.3042;.3167;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude sends the letters as a ghost for you to key.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.3167;.3292;.4625;.475;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Send to Claude: Claude decodes the message and treats it as your prompt.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.475;.4875;.6208;.6333;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Say continue: the window comes back with your message and Claude's track.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6333;.6458;.7792;.7917;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude answers in Morse on the tape: lamp, tone and symbols.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7917;.8042;.9583;.9708;1"/></g>
