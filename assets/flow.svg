<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="mf-t mf-d">
<title id="mf-t">How Claude drives mors</title>
<desc id="mf-d">The mors window, one key and one tape, on the left, Claude on the right, two lanes between them. mors.changed goes up each time a word settles. mors.ask goes up when you ask Doto to spell a word, and mors.suggest comes down with the letters as a ghost for you to key. mors.export goes up when you press Send to Claude, who decodes the message and treats it as the prompt. When you continue, mors.load comes down and the window is back with your message, and mors.play comes down as Claude answers in Morse on the tape. The session block names mors.export as the export, mors.snapshot as the snapshot and mors.load as the restore.</desc>
